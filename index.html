<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krishna Ravtani | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --accent-red: #c9182b;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --text-muted: #555555;
            --card-bg: #0d0d0d;
            --card-border: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            padding: 0 8%;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 0;
            width: 100%;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--accent-red);
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 35px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        .hero-container {
            display: grid;
            grid-template-columns: 3fr 1fr;
            min-height: calc(100vh - 120px);
            align-items: center;
            position: relative;
            padding-bottom: 100px;
        }

        .hero-main {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .location-tag {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .location-tag::before {
            content: '';
            display: inline-block;
            width: 25px;
            height: 1px;
            background-color: var(--accent-red);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 96px;
            font-weight: 600;
            line-height: 1.05;
            letter-spacing: -2px;
            margin-bottom: 10px;
        }

        .accent-title {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 400;
            color: var(--accent-red);
            margin-bottom: 40px;
        }

        .hero-description {
            font-size: 20px;
            line-height: 1.7;
            color: var(--text-secondary);
            max-width: 600px;
            font-weight: 300;
            margin-bottom: 50px;
        }

        .hero-description strong {
            color: var(--text-primary);
            font-weight: 500;
        }

        .cta-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 16px 32px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
            text-align: center;
        }

        .btn-primary {
            background-color: var(--accent-red);
            color: var(--text-primary);
            border: 1px solid var(--accent-red);
        }

        .btn-primary:hover {
            background-color: transparent;
            color: var(--accent-red);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-primary);
            border: 1px solid #222;
        }

        .btn-secondary:hover {
            border-color: var(--text-primary);
            background-color: rgba(255, 255, 255, 0.03);
        }

        .hero-sidebar {
            display: flex;
            flex-direction: column;
            gap: 40px;
            justify-content: flex-end;
            align-items: flex-end;
            text-align: right;
            padding-bottom: 40px;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .meta-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
        }

        .meta-value {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .bg-watermark {
            position: absolute;
            right: -5%;
            font-size: 32vw;
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.015);
            z-index: -1;
            user-select: none;
            pointer-events: none;
        }

        .section-container {
            padding: 100px 0;
            border-top: 1px solid #111;
        }

        .section-heading {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-red);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 56px;
            font-weight: 600;
            margin-bottom: 50px;
        }

        .section-title em {
            font-style: italic;
            font-weight: 400;
            color: var(--accent-red);
        }

        .layout-split {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 80px;
            align-items: start;
        }

        .left-content p {
            font-size: 18px;
            line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-weight: 300;
        }

        .left-content p strong {
            color: var(--text-primary);
            font-weight: 500;
        }

        .profile-table-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            overflow: hidden;
        }

        .table-row {
            display: grid;
            grid-template-columns: 1fr 2fr;
            padding: 24px 30px;
            border-bottom: 1px solid var(--card-border);
            align-items: center;
        }

        .table-row:last-child {
            border-bottom: none;
        }

        .row-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .row-value {
            font-size: 15px;
            color: var(--text-primary);
            font-weight: 400;
        }

        .row-value-highlight {
            color: var(--accent-red);
            font-weight: 500;
        }

        .project-list-block {
            display: flex;
            flex-direction: column;
            gap: 50px;
        }

        .project-item {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 40px;
            padding-bottom: 40px;
            border-bottom: 1px solid #111;
        }

        .project-item:last-child {
            border-bottom: none;
        }

        .project-header h3 {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .project-tags {
            font-size: 11px;
            color: var(--accent-red);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
        }

        .project-link {
            display: inline-block;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 1px solid var(--accent-red);
            padding-bottom: 3px;
            transition: all 0.3s;
        }

        .project-link:hover {
            color: var(--accent-red);
            border-color: var(--text-primary);
        }

        .bullet-items {
            list-style: none;
        }

        .bullet-items li {
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: 10px;
